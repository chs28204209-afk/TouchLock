
name: Build TouchLock APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip TouchLock-CloudBuild-Project.zip -d extracted
          
      - name: Configure JVM targets
        working-directory: extracted/TouchLock/app
        run: |
          cat >> build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF


      - name: Build APK
        working-directory: extracted/TouchLock
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TouchLock-APK
          path: extracted/TouchLock/app/build/outputs/apk/debug/app-debug.apk
